spring.application.name=cuerpo-activo-api

spring.config.import=optional:file:./cuerpo-activo-api.local.properties,\
  optional:file:./cuerpo-activo-api/cuerpo-activo-api.local.properties,\
  optional:file:${npm_config_local_prefix:${INIT_CWD:.}}/cuerpo-activo-api/cuerpo-activo-api.local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/cuerpo_activo
spring.datasource.username=postgres
spring.datasource.password=${CUERPO_ACTIVO_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
